<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAKU - Cinematic Intro</title>
    <!-- Google Fonts for sleek, sharp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="intro-body">
    <!-- Intro Container -->
    <div id="intro-container">
        <canvas id="effects-canvas"></canvas>
        
        <div id="logo-container">
            <div id="word-miraku">
                <div class="letter-wrapper">
                    <span class="letter font-default">M</span>
                    <span class="letter font-aquire">M</span>
                </div>
                <div class="letter-wrapper">
                    <span class="letter font-default">I</span>
                    <span class="letter font-aquire">I</span>
                </div>
                <div class="letter-wrapper">
                    <span class="letter font-default">R</span>
                    <span class="letter font-aquire">R</span>
                </div>
                <div class="letter-wrapper">
                    <span class="letter font-default">A</span>
                    <span class="letter font-aquire">A</span>
                </div>
                <div class="letter-wrapper">
                    <span class="letter font-default">K</span>
                    <span class="letter font-aquire">K</span>
                </div>
                <div class="letter-wrapper">
                    <span class="letter font-default">U</span>
                    <span class="letter font-aquire">U</span>
                </div>
            </div>
            <div id="word-animation">
                animation
            </div>
        </div>
    </div>
    <!-- GSAP for robust timeline control -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/audio-effects.js"></script>
    <script src="js/canvas-effects.js"></script>
    <script src="js/intro.js"></script>
</body>
</html>
