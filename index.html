    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Playfair+Display:ital,wght@1,900&display=swap');
        
        body {
            background: linear-gradient(180deg, #0a0a0a 0%, #171717 50%, #ffffff 100%);
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        #custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 24px;
            height: 24px;
            fill: #ffffff;
            mix-blend-mode: difference;
            transition: transform 0.05s ease-out;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(13px);
            z-index: 50;
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Aesthetic Animated Modal Background */
        .modal-bg-anim {
            background: linear-gradient(45deg, #1f1f1f, #000000, #1f1f1f);
            background-size: 200% 200%;
            animation: gradientMove 6s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-text { color: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .subtitle { color: #9ca3af; }

        .nav-link { position: relative; padding-bottom: 4px; }
        .nav-link::after { content: ''; position: absolute; left: 0; bottom: 0; width: 0; height: 1px; background-color: white; transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }

        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .scroll-indicator { animation: pulse 2s infinite; }
    </style>
</head>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = (e.clientX - 12) + 'px';
            cursor.style.top = (e.clientY - 12) + 'px';
        });

        function openSocialModal() {
            document.getElementById('socialModal').classList.remove('hidden');
        }
