<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation</title>
    <link rel="icon" type="image/png" href="https://mirakuanimation.github.io/mirakufavicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-color: #050505; --text-color: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { 
            background: var(--bg-color); color: var(--text-color); 
            font-family: 'Inter', sans-serif; height: 100vh; overflow-y: auto; 
            scroll-snap-type: y mandatory;
        }

        /* White and black gradient scrollbar */
        body::-webkit-scrollbar { width: 2px; }
        body::-webkit-scrollbar-track { background: #000; }
        body::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, #ffffff, #000000); 
            border-radius: 10px; 
        }

        #cursor-main { 
            position: fixed; top: 0; left: 0; width: 14px; height: 14px; 
            pointer-events: none; z-index: 1000;
            fill: white; filter: drop-shadow(0 0 2px white);
            transform: translate(-50%, -50%);
        }
        #sparkle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        @media (pointer: coarse) { #cursor-main, #sparkle-canvas { display: none !important; } body { cursor: auto !important; } }

        .sidebar { width: 200px; padding: 40px 30px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); position: fixed; height: 100vh; z-index: 100; justify-content: space-between; }
        .nav-menu { display: flex; flex-direction: column; gap: 20px; margin-top: 100px; margin-left: 10px; }
        .nav-link { position: relative; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 15px; letter-spacing: 1px; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
        .nav-link:hover { color: white; transform: translateX(4px); }
        .nav-link.active { color: white; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .symbol { width: 12px; text-align: center; }
        
        /* Enroll Hover Box */
        .enroll-container { position: relative; }
        .enroll-box {
            position: absolute; top: -10px; left: -10px; width: 120%; height: 140%;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .enroll-link:hover + .enroll-box { opacity: 1; }

        .panel { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-left: 200px; scroll-snap-align: start; }
        h1 { font-size: 1.2rem; opacity: 0.5; letter-spacing: 2px; }
    </style>
</head>
<body>

    <svg id="cursor-main" viewBox="0 0 24 24">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
    </svg>
    <canvas id="sparkle-canvas"></canvas>

    <aside class="sidebar">
        <div class="top-section ml-4">
            <div class="brand"><h1>MIRAKU</h1><p>ANIMATION</p></div>
            <nav class="nav-menu">
                <a href="#home" class="nav-link active"><span class="symbol">┃</span> ʜᴏᴍᴇ</a>
                <a href="#about" class="nav-link"><span class="symbol">┃</span> ᴀʙᴏᴜᴛ</a>
                <a href="#news" class="nav-link"><span class="symbol">┃</span> ɴᴇᴡꜱ</a>
                <a href="#social" class="nav-link"><span class="symbol">┃</span> ꜱᴏᴄɪᴀʟ</a>
                <a href="#contact" class="nav-link"><span class="symbol">┃</span> ᴄᴏɴᴛᴀᴄᴛ</a>
            </nav>
        </div>
        <div class="enroll-container ml-4">
            <a href="#" class="nav-link enroll-link"><span class="symbol">➜</span> ᴇɴʀᴏʟʟ</a>
            <div class="enroll-box"></div>
        </div>
    </aside>

    <section id="home" class="panel"><h1>MIRAKU ANIMATION</h1></section>
    <section id="news" class="panel"><h1>NEWS</h1></section>
    <section id="contact" class="panel"><h1>CONTACT</h1></section>

    <script>
        const canvas = document.getElementById('sparkle-canvas');
        const ctx = canvas.getContext('2d');
        const mainCursor = document.getElementById('cursor-main');
        
        let mouse = { x: 0, y: 0 };
        let particles = [];

        window.addEventListener('mousemove', (e) => { 
            mouse = { x: e.clientX, y: e.clientY };
            mainCursor.style.left = mouse.x + 'px';
            mainCursor.style.top = mouse.y + 'px';
        });

        function animate() {
            if (Math.random() > 0.9) {
                particles.push({ 
                    x: mouse.x + (Math.random() - 0.5) * 8, 
                    y: mouse.y + 8, 
                    life: 1, 
                    vx: (Math.random() - 0.5) * 1, 
                    vy: Math.random() * 1 + 0.2,
                    size: Math.random() * 1.2 + 0.2 
                });
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                p.x += p.vx + Math.sin(p.life * 5) * 0.2;
                p.y += p.vy;
                p.life -= 0.015;
                
                if (p.life <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        window.dispatchEvent(new Event('resize'));
        animate();

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
            const symbol = link.querySelector('.symbol');
            const originalSymbol = symbol?.textContent.trim();
            link.addEventListener('mouseenter', () => {
                if (originalSymbol === '➜') symbol.textContent = '↗';
                else if (originalSymbol === '┃') symbol.textContent = '×';
                mainCursor.style.opacity = '0';
            });
            link.addEventListener('mouseleave', () => {
                if (symbol) symbol.textContent = originalSymbol;
                mainCursor.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
