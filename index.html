<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation</title>
    <link rel="icon" type="image/png" href="https://mirakuanimation.github.io/mirakufavicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-color: #050505; --text-color: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { 
            background: var(--bg-color); color: var(--text-color); 
            font-family: 'Inter', sans-serif; height: 100vh; overflow-y: auto; 
            scroll-snap-type: y mandatory;
        }

        #custom-cursor { 
            position: fixed; top: 0; left: 0; width: 17px; height: 17px; 
            pointer-events: none; z-index: 1000; will-change: transform; 
            mix-blend-mode: difference; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s ease;
        }
        .star-element { width: 100%; height: 100%; display: block; fill: #ffffff; }
        #sparkle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        @media (pointer: coarse) { #custom-cursor, #sparkle-canvas { display: none !important; } body { cursor: auto !important; } }

        .sidebar { width: 200px; padding: 40px 30px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); position: fixed; height: 100vh; z-index: 100; justify-content: space-between; }
        
        /* Updated Scrollbar - Positioned at far left corner */
        .scroll-rail { 
            position: absolute; left: 0; top: 0; bottom: 0; width: 6px; 
            background: rgba(255, 255, 255, 0.03); 
        }
        .scroll-thumb { 
            width: 100%; height: 120px; 
            background: #50a8a8; /* Updated to match screenshot teal/cyan */
            transition: transform 0.1s linear; border-radius: 0;
        }

        .nav-menu { display: flex; flex-direction: column; gap: 20px; margin-top: 100px; margin-left: 10px; }
        .nav-link { 
            position: relative; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 15px; 
            letter-spacing: 1px; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; padding: 5px 10px;
        }
        .nav-link:hover { color: white; }
        .nav-link.active { color: white; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .symbol { width: 12px; text-align: center; }
        
        /* Box hover effect - ONLY for Enroll */
        .enroll-link::before { 
            content: ''; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.2); 
            opacity: 0; transition: opacity 0.3s ease; transform: scale(0.95);
        }
        .enroll-link:hover::before { opacity: 1; transform: scale(1); }

        /* Glow effect */
        .enroll-link { animation: glow 2s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 5px rgba(255,255,255,0.2); } to { text-shadow: 0 0 15px rgba(255,255,255,0.8); } }

        .panel { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-left: 200px; scroll-snap-align: start; }
        h1 { font-size: 1.2rem; opacity: 0.5; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="custom-cursor"><svg class="star-element" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></div>
    <canvas id="sparkle-canvas"></canvas>

    <aside class="sidebar">
        <!-- Scroll Rail moved here to be at the absolute left of the sidebar -->
        <div class="scroll-rail">
            <div class="scroll-thumb"></div>
        </div>

        <div class="top-section ml-4">
            <div class="brand"><h1>MIRAKU</h1><p>ANIMATION</p></div>
            
            <nav class="nav-menu">
                <a href="#home" class="nav-link active"><span class="symbol">┃</span> ʜᴏᴍᴇ</a>
                <a href="#about" class="nav-link"><span class="symbol">┃</span> ᴀʙᴏᴜᴛ</a>
                <a href="#news" class="nav-link"><span class="symbol">┃</span> ɴᴇᴡꜱ</a>
                <a href="#social" class="nav-link"><span class="symbol">┃</span> ꜱᴏᴄɪᴀʟ</a>
                <a href="#contact" class="nav-link"><span class="symbol">┃</span> ᴄᴏɴᴛᴀᴄᴛ</a>
            </nav>
        </div>

        <div class="enroll-container ml-4">
            <a href="#" class="nav-link enroll-link"><span class="symbol">➜</span> ᴇɴʀᴏʟʟ</a>
        </div>
    </aside>

    <section id="home" class="panel"><h1>MIRAKU ANIMATION</h1></section>
    <section id="about" class="panel"><h1>ABOUT</h1></section>
    <section id="news" class="panel"><h1>NEWS</h1></section>
    <section id="social" class="panel"><h1>SOCIAL</h1></section>
    <section id="contact" class="panel"><h1>CONTACT</h1></section>

    <script>
        const canvas = document.getElementById('sparkle-canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('custom-cursor');
        const scrollThumb = document.querySelector('.scroll-thumb');
        const scrollRail = document.querySelector('.scroll-rail');
        
        window.addEventListener("scroll", () => {
            const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = window.scrollY / totalScroll;
            const railHeight = scrollRail.offsetHeight - scrollThumb.offsetHeight;
            scrollThumb.style.transform = `translateY(${scrollPercent * railHeight}px)`;
        });

        window.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
            const symbol = link.querySelector('.symbol');
            const originalSymbol = symbol.textContent.trim();
            
            link.addEventListener('mouseenter', () => { 
                if (originalSymbol === '➜') {
                    symbol.textContent = '↗';
                } else if (originalSymbol === '┃') {
                    symbol.textContent = '×';
                }
                cursor.style.opacity = '0'; 
            });
            link.addEventListener('mouseleave', () => { 
                symbol.textContent = originalSymbol; 
                cursor.style.opacity = '1'; 
            });
        });
    </script>
</body>
</html>
