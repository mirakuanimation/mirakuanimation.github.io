<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation</title>
    <link rel="icon" type="image/png" href="https://mirakuanimation.github.io/mirakufavicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex;
            overflow: hidden;
        }

        #cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 9999;
    will-change: transform;
    }

        .sidebar { 
            width: 200px; padding: 40px 30px; 
            display: flex; flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            justify-content: flex-start;
        }

        .brand { margin-bottom: 0px; text-align: left; }
        .brand h1 { 
            font-size: 25px; letter-spacing: 2px; text-transform: uppercase;
            font-weight: 800; /* Changed from glow to bold */
        }
        .brand p { font-size: 13px; opacity: 0.5; letter-spacing: 2px; margin-top: 4px; }

        .nav-menu { 
            display: flex; flex-direction: column; 
            gap: 20px;
            width: 100%;
            margin-top: 150px; /* Pushed buttons down */
        }
        
        .nav-link { 
            color: rgba(255,255,255,0.6); 
            text-decoration: none; font-size: 15px; 
            letter-spacing: 1px; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 12px;
            width: 100%;
        }

        /* Fixed width container to prevent jitter */
        .symbol { width: 12px; display: inline-block; text-align: center; }
        .nav-link:hover { color: white; padding-left: 5px; }

        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        h1 { font-size: 1.2rem; opacity: 0.5; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="cursor">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="white">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
    </div>

    <aside class="sidebar">
        <div class="brand">
           <bold> <h1>MIRAKU</h1></bold>
            <p>ANIMATION</p>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-link"><span class="symbol">┃</span> ᴀʙᴏᴜᴛ</a>
            <a href="#" class="nav-link"><span class="symbol">┃</span> ɴᴇᴡꜱ</a>
            <a href="#" class="nav-link"><span class="symbol">┃</span> ꜱᴏᴄɪᴀʟ</a>
            <a href="#" class="nav-link"><span class="symbol">┃</span> ᴄᴏɴᴛᴀᴄᴛ</a>
            <a href="#" class="nav-link"><span class="symbol">┃</span> ᴇɴʀᴏʟʟ</a>
        </nav>
    </aside>

    <main>
        <h1>MIRAKU ANIMATION</h1>
    </main>

    <script>
const cursor = document.getElementById('cursor');
const navLinks = document.querySelectorAll('.nav-link');

document.addEventListener('mousemove', (e) => {
    cursor.style.transform =
        `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
});

navLinks.forEach(link => {
    const symbol = link.querySelector('.symbol');

    link.addEventListener('mouseenter', () => {
        symbol.textContent = '×';
    });

    link.addEventListener('mouseleave', () => {
        symbol.textContent = '┃';
    });
});
</script>
</body>
</html>
