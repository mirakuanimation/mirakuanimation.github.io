<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .brand-font { font-family: 'Cinzel', serif; }
        .gradient-text {
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="p-8 flex justify-between items-center max-w-6xl mx-auto w-full">
        <div class="flex flex-col items-center">
            <svg viewBox="0 0 200 120" class="w-32 h-20 mb-2 fill-current text-white">
                <!-- Arc -->
                <path d="M50 80 Q 100 60 150 80" stroke="white" fill="none" stroke-width="1" opacity="0.6" />
                <!-- Crescent Moon -->
                <path d="M100 20 A 15 15 0 1 0 100 50 A 10 10 0 1 1 100 20" fill="white" />
                <!-- Stars -->
                <path d="M70 35 L72 40 L70 45 L68 40 Z" fill="white" />
                <path d="M130 35 L132 40 L130 45 L128 40 Z" fill="white" />
                <path d="M85 25 L86 28 L85 31 L84 28 Z" fill="white" opacity="0.7" />
            </svg>
            <div class="brand-font text-2xl tracking-[0.2em]">MIRAKU</div>
            <div class="text-[10px] tracking-[0.5em] text-gray-400 uppercase">Animation</div>
        </div>
        <nav class="space-x-8 text-sm uppercase tracking-widest text-gray-400 hidden md:block">
            <a href="#" class="hover:text-white transition">Work</a>
            <a href="#" class="hover:text-white transition">Studio</a>
            <a href="#" class="hover:text-white transition">Contact</a>
        </nav>
    </header>

    <!-- Hero -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-4">
        <h1 class="brand-font text-5xl md:text-7xl mb-6 gradient-text">Where Dreams Animate.</h1>
        <p class="max-w-xl text-gray-400 font-light text-lg leading-relaxed mb-10">
            Crafting immersive visual stories through meticulous hand-drawn detail and modern animation techniques.
        </p>
        <button class="border border-gray-700 px-8 py-3 hover:bg-white hover:text-black transition duration-300 uppercase tracking-widest text-sm">
            Explore Portfolio
        </button>
    </main>

    <!-- Footer -->
    <footer class="p-8 text-center text-gray-600 text-xs uppercase tracking-widest">
        &copy; 2026 Miraku Animation Studio. All rights reserved.
    </footer>

</body>
</html>
