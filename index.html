<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        
        body {
            background: linear-gradient(180deg, #0a0a0a 0%, #171717 50%, #ffffff 100%);
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        #custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 24px;
            height: 24px;
            fill: #ffffff;
            mix-blend-mode: difference;
            transition: transform 0.05s ease-out;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(13px);
            z-index: 50;
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-animation {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-particle {
            position: absolute;
            font-size: 1.5rem;
            /* White to black gradient effect using background-clip */
            background: linear-gradient(to bottom, #ffffff, #000000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        .hero-text { color: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .subtitle { color: #9ca3af; }

        .particle {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            color: #ffffff;
            font-size: 0.8rem;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
            z-index: 60;
            animation: rise 4s ease-out forwards;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) translateX(var(--dx)); opacity: 0; }
        }
    </style>
</head>
<body class="text-gray-900">

    <div id="custom-cursor"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>

    <nav class="flex justify-between items-center px-12 py-10 w-full text-white">
        <div class="flex flex-col items-start">
            <span class="text-3xl tracking-tighter">MIRAKU</span>
            <span class="text-xs uppercase tracking-[0.2em] text-gray-400">Animation</span>
        </div>
        <div class="flex gap-10 text-xs uppercase tracking-widest font-light text-gray-300">
            <a href="#" class="hover:text-white transition">Projects</a>
            <a href="#" class="hover:text-white transition">News</a>
            <a href="javascript:void(0)" onclick="openSocialModal()" class="hover:text-white transition">Social Media</a>
            <a href="javascript:void(0)" onclick="toggleRecruitModal()" class="hover:text-white transition">Recruit</a>
            <a href="javascript:void(0)" onclick="toggleContactModal()" class="hover:text-white transition">Contact</a>
        </div>
    </nav>

    <main class="flex flex-col items-center justify-center pt-20 pb-40">
        <h1 class="text-6xl font-bold hero-text mb-2">Animation Studio</h1>
        <p class="text-sm uppercase tracking-[0.3em] subtitle">Specialized in 3D to 2D Anime</p>
    </main>

    <div id="socialModal" class="hidden modal-overlay">
        <div class="bg-animation" id="bgAnim"></div>
        <div class="bg-white p-8 rounded-3xl w-72 text-center shadow-2xl relative z-10">
            <h2 class="text-sm font-bold mb-6 uppercase tracking-widest text-gray-900">Social Media</h2>
            <div class="flex justify-center gap-6">
                <a href="https://www.youtube.com/@mirakuanimation" target="_blank" class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center hover:scale-110 transition">
                    <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.377.505 9.377.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </a>
                <a href="https://www.patreon.com/cw/mirakuanimation" target="_blank" class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center hover:scale-110 transition">
                    <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M14.93 1.55c-4.47 0-8.1 3.63-8.1 8.1 0 4.47 3.63 8.1 8.1 8.1 4.47 0 8.1-3.63 8.1-8.1 0-4.47-3.63-8.1-8.1-8.1zM3.46 22.45h2.64V7.55H3.46v14.9z"/></svg>
                </a>
            </div>
            <button onclick="toggleSocialModal()" class="mt-8 text-[10px] uppercase text-gray-500 hover:text-gray-800 transition">Close</button>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = (e.clientX - 12) + 'px';
            cursor.style.top = (e.clientY - 12) + 'px';
        });

        function createBgParticles() {
            const container = document.getElementById('bgAnim');
            container.innerHTML = '';
            for(let i=0; i<20; i++) {
                const p = document.createElement('div');
                p.className = 'bg-particle';
                p.innerText = Math.random() > 0.5 ? '⭐' : '🌙';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 5 + 5) + 's';
                p.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(p);
            }
        }

        function openSocialModal() {
            createBgParticles();
            document.getElementById('socialModal').classList.remove('hidden');
            const items = [{char: '⭐', count: 55}, {char: '🌙', count: 44}];
            items.forEach(item => {
                for(let i=0; i<item.count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.innerText = item.char;
                    p.style.left = (Math.random() * 100) + 'vw';
                    p.style.setProperty('--dx', (Math.random() * 400 - 200) + 'px');
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 4000);
                }
            });
        }
        function toggleSocialModal() { document.getElementById('socialModal').classList.add('hidden'); }
        function toggleRecruitModal() {}
        function toggleContactModal() {}
    </script>
</body>
</html>
