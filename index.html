<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; cursor: none; }
        
        /* Custom Star Cursor */
        #cursor {
            position: fixed; top: 0; left: 0; width: 20px; height: 20px;
            pointer-events: none; z-index: 9999;
            filter: drop-shadow(0 0 8px white);
        }
    </style>
</head>
<body class="bg-[#050505] text-white flex overflow-hidden h-screen">

    <div id="cursor" class="text-white text-xl">✦</div>

    <nav class="w-48 border-r border-zinc-800 p-8 flex flex-col justify-between">
        <!-- Branding -->
        <div>
            <div class="mb-16">
                <h1 class="text-3xl font-black tracking-tighter">MIRAKU</h1>
                <p class="text-xs uppercase tracking-[0.2em] text-zinc-500 mt-1">Animation</p>
            </div>

            <!-- Navigation Links -->
            <ul class="space-y-6">
                <li><a href="#" class="text-zinc-400 hover:text-white hover:translate-x-3 transition-all duration-300 uppercase text-sm tracking-widest block">About</a></li>
                <li><a href="#" class="text-zinc-400 hover:text-white hover:translate-x-3 transition-all duration-300 uppercase text-sm tracking-widest block">News</a></li>
                <li><a href="#" class="text-zinc-400 hover:text-white hover:translate-x-3 transition-all duration-300 uppercase text-sm tracking-widest block">Social Media</a></li>
                <li><a href="#" class="text-zinc-400 hover:text-white hover:translate-x-3 transition-all duration-300 uppercase text-sm tracking-widest block">Contact</a></li>
                <li><a href="#" class="text-zinc-400 hover:text-white hover:translate-x-3 transition-all duration-300 uppercase text-sm tracking-widest block">Enroll</a></li>
            </ul>
        </div>
        
        <div class="text-[10px] text-zinc-600 uppercase tracking-widest">
            © 2026 Miraku Studio
        </div>
    </nav>

    <main class="flex-1 p-20 overflow-y-auto">
        <h2 class="text-6xl font-black leading-tight max-w-2xl">
            CREATING WORLDS <span class="text-zinc-700">BEYOND IMAGINATION.</span>
        </h2>
        <p class="mt-8 text-zinc-400 max-w-md">
            Premium studio dedicated to the art of cinematic storytelling and high-fidelity movement.
        </p>
    </main>

    <script>
        const cursor = document.getElementById('cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX - 10}px, ${e.clientY - 10}px)`;
        });

        // Add hover effect for links
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('mouseenter', () => cursor.style.transform += ' scale(2)');
            link.addEventListener('mouseleave', () => cursor.style.transform = cursor.style.transform.replace(' scale(2)', ''));
        });
    </script>
</body>
</html>
