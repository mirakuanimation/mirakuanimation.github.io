<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation</title>
    <link rel="icon" type="image/png" href="https://mirakuanimation.github.io/mirakufavicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex;
            overflow: hidden;
        }

        /* Cursor */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 17px;
            height: 17px;
            pointer-events: none;
            z-index: 1000;
            will-change: transform;
            mix-blend-mode: difference;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .star-element {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ffffff;
        }

        /* Sparkle Canvas */
        #sparkle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        @media (pointer: coarse) {
            #custom-cursor, #sparkle-canvas { display: none !important; }
            body { cursor: auto !important; }
        }

        .sidebar { 
            width: 200px; padding: 40px 30px; 
            display: flex; flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            justify-content: flex-start;
        }

        .brand { margin-bottom: 0px; text-align: left; }
        .brand h1 { 
            font-size: 25px; letter-spacing: 2px; text-transform: uppercase;
            font-weight: 800;
        }
        .brand p { font-size: 13px; opacity: 0.5; letter-spacing: 2px; margin-top: 4px; }

        .nav-menu { 
            display: flex; flex-direction: column; 
            gap: 20px;
            width: 100%;
            margin-top: 150px;
        }
        
        .nav-link { 
            color: rgba(255,255,255,0.6); 
            text-decoration: none; font-size: 15px; 
            letter-spacing: 1px; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 12px;
            width: 100%;
        }

        .symbol { width: 12px; display: inline-block; text-align: center; }
        .nav-link:hover { color: white; padding-left: 5px; }

        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        h1 { font-size: 1.2rem; opacity: 0.5; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="custom-cursor">
        <svg class="star-element" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    </div>

    <canvas id="sparkle-canvas"></canvas>

    <aside class="sidebar">
        <div class="brand">
            <h1>MIRAKU</h1>
            <p>ANIMATION</p>
        </div>
       <nav class="nav-menu">
    <a href="index.html" class="nav-link active">
        <span class="symbol">┃</span> ʜᴏᴍᴇ
    </a>

    <a href="about.html" class="nav-link">
        <span class="symbol">┃</span> ᴀʙᴏᴜᴛ
    </a>

    <a href="news.html" class="nav-link">
        <span class="symbol">┃</span> ɴᴇᴡꜱ
    </a>

    <a href="social.html" class="nav-link">
        <span class="symbol">┃</span> ꜱᴏᴄɪᴀʟ
    </a>

    <a href="contact.html" class="nav-link">
        <span class="symbol">┃</span> ᴄᴏɴᴛᴀᴄᴛ
    </a>

    <a href="enroll.html" class="nav-link">
        <span class="symbol">┃</span> ᴇɴʀᴏʟʟ
    </a>
</nav>
    </aside>

    <main>
        <h1>MIRAKU ANIMATION</h1>
    </main>

    <script>

        .nav-link {
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.nav-link:hover {
    color: white;
    padding-left: 5px;
}

/* Active Page */
.nav-link.active {
    color: #ffffff;
    padding-left: 5px;
    text-shadow:
        0 0 5px rgba(255,255,255,0.8),
        0 0 10px rgba(255,255,255,0.6),
        0 0 20px rgba(255,255,255,0.4);
}

.nav-link.active .symbol {
    color: white;
}
        
        const canvas = document.getElementById('sparkle-canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('custom-cursor');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let lastSpawnTime = 0;

        window.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
            
            const now = Date.now();
            if (now - lastSpawnTime > 80) {
                const offsetX = (Math.random() - 0.5) * 15;
                const offsetY = 8 + (Math.random() * 10); 
                particles.push(new Sparkle(e.clientX + offsetX, e.clientY + offsetY));
                lastSpawnTime = now;
            }
        });

        class Sparkle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() * 1.5);
                this.size = 1 + Math.random() * 3;
                this.initialSize = this.size;
                this.opacity = 1;
                this.decay = 0.015 + Math.random() * 0.01;
                this.color = Math.random() > 0.5 ? 'white' : 'black';
                this.rotation = Math.random() * Math.PI;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                this.opacity -= this.decay;
                this.rotation += this.rotationSpeed;
                this.size = Math.max(0, this.initialSize * this.opacity);
            }

            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                for (let i = 0; i < 4; i++) {
                    ctx.lineTo(Math.cos(Math.PI/2*3 + i*Math.PI/2) * this.size, Math.sin(Math.PI/2*3 + i*Math.PI/2) * this.size);
                    ctx.lineTo(Math.cos(Math.PI/2*3 + i*Math.PI/2 + Math.PI/4) * this.size * 0.25, Math.sin(Math.PI/2*3 + i*Math.PI/2 + Math.PI/4) * this.size * 0.25);
                }
                ctx.closePath();
                ctx.fillStyle = this.color === 'white' ? '#ffffff' : '#000000';
                ctx.fill();
                ctx.restore();
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.opacity > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }
        loop();

        const hide = () => { cursor.style.opacity = '0'; };
        const show = () => { cursor.style.opacity = '1'; };
        document.querySelectorAll('button, a, input, select, textarea, label').forEach(el => {
            el.addEventListener('mouseenter', hide);
            el.addEventListener('mouseleave', show);
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            const symbol = link.querySelector('.symbol');
            link.addEventListener('mouseenter', () => { symbol.textContent = '×'; });
            link.addEventListener('mouseleave', () => { symbol.textContent = '┃'; });
        });

        const currentPage = location.pathname.split("/").pop();

document.querySelectorAll(".nav-link").forEach(link => {
    const href = link.getAttribute("href");

    if (
        href === currentPage ||
        (currentPage === "" && href === "index.html")
    ) {
        link.classList.add("active");
    }
});
    </script>
</body>
</html>
