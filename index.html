<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraku Animation</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex; 
            overflow: hidden;
        }

        /* Perfect Cursor styling */
        #cursor {
            position: fixed; top: 0; left: 0; 
            width: 20px; height: 20px;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sidebar */
        .sidebar { width: 250px; padding: 40px; display: flex; flex-direction: column; }
        .brand { margin-bottom: 80px; }
        .brand h1 { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
        .brand p { font-size: 12px; opacity: 0.7; letter-spacing: 4px; }
        .nav-menu { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        .nav-link { 
            color: white; text-decoration: none; font-size: 14px; 
            letter-spacing: 2px; transition: opacity 0.3s ease;
            display: inline-block;
        }
        .nav-link:hover { opacity: 0.5; }

        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="cursor">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1" stroke-linejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
    </div>

    <aside class="sidebar">
        <div class="brand">
            <h1>MIRAKU</h1>
            <p>ANIMATION</p>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-link">About</a>
            <a href="#" class="nav-link">News</a>
            <a href="#" class="nav-link">Social Media</a>
            <a href="#" class="nav-link">Contact</a>
            <a href="#" class="nav-link">Enroll</a>
        </nav>
    </aside>

    <main>
        <h1>Welcome to Miraku</h1>
    </main>

    <script>
        const cursor = document.getElementById('cursor');
        
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        // Optimized mouse listener
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // High-performance animation frame loop
        function animateCursor() {
            // Increased smoothing factor (0.2 -> 0.35) for better responsiveness
            cursorX += (mouseX - cursorX) * 0.35;
            cursorY += (mouseY - cursorY) * 0.35;
            
            // Centering the star cursor (offset by half of 20px)
            cursor.style.transform = `translate(${cursorX - 10}px, ${cursorY - 10}px)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Interactive states
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('mouseenter', () => {
                cursor.style.transform += ' scale(1.2) rotate(45deg)';
            });
            link.addEventListener('mouseleave', () => {
                cursor.style.transform = cursor.style.transform.replace(' scale(1.2) rotate(45deg)', '');
            });
        });
    </script>
</body>
</html>
